services:
  # `gvc-backend`, not `backend`: Notes and GAM each already have a service called
  # `backend`, and nginx here resolves its upstream by name (frontend/nginx.conf).
  gvc-backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      # All of data/: the database, finished renders, the cache of GAM files a render
      # fetched, and pictures attached to the assistant, so a rebuild keeps them all.
      - ./data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/db/gvc.db
      # Load-bearing. Left to default, the data directory is worked out from where
      # config.py sits, which in the image is /app/app/, so it lands on /data, outside
      # the volume above, and everything but the database is lost on every rebuild.
      - DATA_DIR=/app/data
      # Must match gecko-notes'. GVC verifies the sessions Notes issues; a different
      # secret means every token is rejected. No default — the app refuses to start.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
      - GAM_BASE_URL=${GAM_BASE_URL:-https://assets.geckopico.com}
      - GAM_TIMEOUT_SECONDS=${GAM_TIMEOUT_SECONDS:-30}
      - NOTE_MEDIA_MAX_MB=${NOTE_MEDIA_MAX_MB:-4096}
      - RENDER_CONCURRENCY=${RENDER_CONCURRENCY:-1}
      - RENDER_MAX_SEGMENTS=${RENDER_MAX_SEGMENTS:-200}
      - RENDER_MAX_NARRATION_CHARS=${RENDER_MAX_NARRATION_CHARS:-60000}
      - RENDER_CACHE_MAX_GB=${RENDER_CACHE_MAX_GB:-20}
      - RENDER_MAX_FILE_MB=${RENDER_MAX_FILE_MB:-8192}
      - RENDER_KEEP_WORK=${RENDER_KEEP_WORK:-false}
      - MEDIA_URL_TTL_SECONDS=${MEDIA_URL_TTL_SECONDS:-3600}
      - ADMIN_USERS=${ADMIN_USERS:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
    # Never published to the host: the frontend proxies it, and ProxyHeadersMiddleware
    # trusts X-Forwarded-* from any peer that can reach it.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Generous: the container runs migrations before uvicorn binds a port.
      start_period: 30s
    networks:
      - default

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-18083}:80"
    environment:
      # The CSP's connect-src; must agree with the backend's value.
      - NOTES_BASE_URL=${NOTES_BASE_URL:-https://notes.geckopico.com}
      # The CSP's img-src and media-src, for GAM thumbnails and previews; same rule.
      - GAM_BASE_URL=${GAM_BASE_URL:-https://assets.geckopico.com}
    depends_on:
      - gvc-backend
    networks:
      - default

networks:
  default:
    name: gvc_default
