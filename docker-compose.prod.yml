# Overlay for reverse-proxy deployments.
#
# Caddy (from the infra repo) terminates TLS and routes gvc.geckopico.com to the
# frontend over the shared external `web` network. This joins the frontend to it;
# without it, every request through the proxy is a 502.
#
# Only the frontend, unlike GAM: the backend has no reason to be on a network the other
# apps share, and its nginx reaches it over `gvc_default`.
#
# Set this in .env so a plain `docker compose up -d` cannot forget it:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml

services:
  # GVC's server calls GAM and Notes at their public names (GAM_BASE_URL,
  # NOTES_BASE_URL). On the suite's server all three run on one machine, and from
  # inside a container those names resolve to the machine's own public address,
  # which the host does not route back in (hairpin NAT): every search failed with
  # `gam_unavailable`. Pointing them at the Docker host reaches Caddy directly,
  # with the same names and so the same TLS certificates.
  gvc-backend:
    extra_hosts:
      - "assets.geckopico.com:host-gateway"
      - "notes.geckopico.com:host-gateway"

  frontend:
    networks:
      - default
      - web

networks:
  web:
    external: true
